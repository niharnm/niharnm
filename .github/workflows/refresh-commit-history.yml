name: Refresh commit history

on:
  schedule:
    - cron: "17 9 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-commit-history
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Advance the image cache
        run: |
          cache_month="$(date -u +%Y-%m)"
          CACHE_MONTH="$cache_month" perl -0pi -e 's/v%3D[0-9]{4}-[0-9]{2}/v%3D$ENV{CACHE_MONTH}/g' README.md
          grep --quiet "v%3D${cache_month}" README.md

      - name: Publish the new cache key
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh commit history"
          git push
