name: Refresh commit history

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-commit-history
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Refresh themed charts
        run: .github/scripts/refresh-commit-history.sh

      - name: Publish changed charts
        run: |
          if git diff --quiet -- images/niharnm-commit-history-light.svg images/niharnm-commit-history-dark.svg; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/niharnm-commit-history-light.svg images/niharnm-commit-history-dark.svg
          git commit -m "chore: refresh commit history"
          git push
